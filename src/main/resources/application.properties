spring.application.name=gestorNF

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.config.import=optional:file:.env.properties

envio.email.remetente=${EMAIL_REMETENTE}
envio.email.nomeRemetente=GestorNF
envio.email.url-verificacao=${BACKEND_URL}/usuario/verificar-email
envio.email.url-recuperacao=${FRONTEND_URL}/redefinir-senha

server.port=${PORT:8080}

resend.api.key=${RESEND_API_KEY}