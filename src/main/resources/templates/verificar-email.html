<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Verificação de Email - GestorNF</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            color: #333;
        }

        .content {
            margin: 30px 0;
            color: #555;
            line-height: 1.6;
        }

        .button-container {
            text-align: center;
            margin: 30px 0;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 12px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>GestorNF</h1>

        <h2>Verificação de Email</h2>

    </div>

    <div class="content">

        <p>
            Olá,
            <strong th:text="${nome}">Usuário</strong>!
        </p>

        <p>
            Obrigado por se cadastrar no GestorNF.
        </p>

        <p>
            Para confirmar seu endereço de email,
            clique no botão abaixo:
        </p>

        <div class="button-container">

            <a
                    class="button"
                    th:href="${linkVerificacao}"
            >
                Verificar meu email
            </a>

        </div>

        <p>
            Se você não realizou este cadastro,
            pode ignorar este email.
        </p>

    </div>

    <div class="footer">

        <p>
            GestorNF - Sistema de gerenciamento de notas fiscais
        </p>

    </div>

</div>

</body>

</html>
