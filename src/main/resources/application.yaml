spring:

  config:
    import: optional:file:.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    enabled: true


envio:
  email:
    remetente: ${EMAIL_USERNAME}
    nomeRemetente: "Gestor de Notas Fiscais"
    url-verificacao: http://localhost:8080/usuario/verificar-email